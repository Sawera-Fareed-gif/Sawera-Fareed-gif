<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1280" height="740" viewBox="0 0 1280 740">
  <defs>
    <clipPath id="bannerClip"><rect x="0" y="0" width="1280" height="740" rx="28"/></clipPath>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a0b2e"/>
      <stop offset="55%" stop-color="#2d1250"/>
      <stop offset="100%" stop-color="#3a1560"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff6ec7">
        <animate attributeName="stop-color" values="#ff6ec7;#a239ca;#5ef1ff;#ff6ec7" dur="5s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#a239ca">
        <animate attributeName="stop-color" values="#a239ca;#5ef1ff;#ff6ec7;#a239ca" dur="5s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <linearGradient id="barGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#a239ca"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#5ef1ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#5ef1ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#5ef1ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="blurBig" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="30"/></filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="neonGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6" result="b1"/>
      <feMerge><feMergeNode in="b1"/><feMergeNode in="b1"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <style>
    .nameLetter { font-weight: 400; }
    .pill:hover rect { filter: url(#softGlow); }
    text { user-select: none; }
  </style>

  <g clip-path="url(#bannerClip)">
    <rect x="0" y="0" width="1280" height="740" fill="url(#bgGrad)"/>

    <circle cx="140" cy="620" r="120" fill="#a239ca" opacity="0.18" filter="url(#blurBig)">
      <animate attributeName="r" values="110;140;110" dur="6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.12;0.22;0.12" dur="6s" repeatCount="indefinite"/>
    </circle>
    <circle cx="1150" cy="90" r="100" fill="#ff6ec7" opacity="0.15" filter="url(#blurBig)">
      <animate attributeName="r" values="90;115;90" dur="7s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.10;0.2;0.10" dur="7s" repeatCount="indefinite"/>
    </circle>

    <!-- Terminal typing line -->
    <g transform="translate(40,28)">
      <rect x="-14" y="-24" width="480" height="36" rx="8" fill="#150822" stroke="#4a2472" stroke-width="1"/>
      <circle cx="0" cy="-10" r="4" fill="#ff5f56"/>
      <circle cx="14" cy="-10" r="4" fill="#ffbd2e"/>
      <circle cx="28" cy="-10" r="4" fill="#27c93f"/>
      <clipPath id="termClip">
        <rect x="42" y="-24" width="0" height="34">
          <animate attributeName="width" from="0" to="360" begin="0.2s" dur="2.0s" fill="freeze"/>
        </rect>
      </clipPath>
      <g clip-path="url(#termClip)">
        <text x="42" y="0" font-family="'Fira Code',monospace" font-size="14" fill="#7CFC9A">user@dev:~$ cat README.md</text>
      </g>
      <rect x="249.5" y="-12" width="8" height="16" fill="#7CFC9A">
        <animate attributeName="opacity" values="1;0;1" dur="0.9s" begin="2.2s" repeatCount="indefinite"/>
      </rect>
    </g>

    <!-- Neon sign -->
    <g transform="translate(700,60)" filter="url(#neonGlow)">
      <text x="0" y="0" font-family="'Segoe UI',sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="#ff2fd0" stroke="#b34bff" stroke-width="0.6">
        KEEP CODING KEEP GROWING
        <animate attributeName="opacity" values="1;1;0.3;1;1;0.2;1;1;1;0.4;1;1" keyTimes="0;0.42;0.44;0.46;0.6;0.62;0.64;0.8;0.9;0.92;0.94;1" dur="4.2s" begin="1s" repeatCount="indefinite"/>
      </text>
    </g>

    <!-- Name -->
    <g transform="translate(40,150)">
      <text class="nameLetter" x="0" y="0" font-family="'Segoe Script','Brush Script MT',cursive" font-size="72" fill="url(#nameGrad)">Sawera</text>
    </g>

    <!-- Role -->
    <g transform="translate(40,195)">
      <text x="0" y="0" font-family="'Fira Code',monospace" font-size="21" fill="#c9a9e8">Software Engineering Student</text>
    </g>

    <!-- Quote box -->
    <g transform="translate(40,225)">
      <rect x="0" y="0" width="560" height="62" rx="14" fill="#241238" stroke="#ff6ec7" stroke-width="1.4" opacity="0.95">
        <animate attributeName="stroke-opacity" values="0.5;1;0.5" dur="2.6s" repeatCount="indefinite"/>
      </rect>
      <text x="20" y="26" font-family="'Fira Code',monospace" font-size="13" fill="#c9a9e8">$ echo $TAGLINE</text>
      <text x="20" y="48" font-family="'Fira Code',monospace" font-size="16" fill="#ffd76e" font-weight="600">Always Learning Always Building</text>
    </g>

    <!-- About me -->
    <g transform="translate(40,320)">
      <text x="0" y="0" font-family="'Fira Code',monospace" font-size="15.5" fill="#f3e9ff">Software Engineering student who loves clean code.</text>
      <text x="0" y="30" font-family="'Fira Code',monospace" font-size="15.5" fill="#f3e9ff">Building with Java, SQL and Python day to day.</text>
      <text x="0" y="60" font-family="'Fira Code',monospace" font-size="15.5" fill="#f3e9ff">Exploring Data Structures, DB Design and UML.</text>
    </g>

    <!-- Tech pills -->
    <g transform="translate(40,438)">
      <g transform="translate(0,0)" class="pill">
        <rect width="70" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="2.40s" repeatCount="indefinite"/>
        </rect>
        <text x="35.0" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">Java</text>
      </g>
      <g transform="translate(80,0)" class="pill">
        <rect width="61" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="2.52s" repeatCount="indefinite"/>
        </rect>
        <text x="30.5" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">SQL</text>
      </g>
      <g transform="translate(151,0)" class="pill">
        <rect width="88" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="2.64s" repeatCount="indefinite"/>
        </rect>
        <text x="44.0" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">Python</text>
      </g>
      <g transform="translate(249,0)" class="pill">
        <rect width="142" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="2.76s" repeatCount="indefinite"/>
        </rect>
        <text x="71.0" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">Git &amp; GitHub</text>
      </g>
      <g transform="translate(401,0)" class="pill">
        <rect width="79" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="2.88s" repeatCount="indefinite"/>
        </rect>
        <text x="39.5" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">MySQL</text>
      </g>
      <g transform="translate(0,40)" class="pill">
        <rect width="151" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="3.00s" repeatCount="indefinite"/>
        </rect>
        <text x="75.5" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">IntelliJ IDEA</text>
      </g>
      <g transform="translate(161,40)" class="pill">
        <rect width="79" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="3.12s" repeatCount="indefinite"/>
        </rect>
        <text x="39.5" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">Figma</text>
      </g>
      <g transform="translate(250,40)" class="pill">
        <rect width="97" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="3.24s" repeatCount="indefinite"/>
        </rect>
        <text x="48.5" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">draw.io</text>
      </g>
      <g transform="translate(357,40)" class="pill">
        <rect width="142" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="3.36s" repeatCount="indefinite"/>
        </rect>
        <text x="71.0" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">UML Modeling</text>
      </g>
      <g transform="translate(509,40)" class="pill">
        <rect width="61" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="3.48s" repeatCount="indefinite"/>
        </rect>
        <text x="30.5" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">DSA</text>
      </g>
      <g transform="translate(580,40)" class="pill">
        <rect width="92" height="30" rx="15" fill="#331a52" stroke="#7b3fae" stroke-width="1.2">
          <animate attributeName="stroke" values="#7b3fae;#ff6ec7;#7b3fae" dur="3s" begin="3.60s" repeatCount="indefinite"/>
        </rect>
        <text x="46.0" y="20" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="13" fill="#f3e9ff">VS Code</text>
      </g>
    </g>

    <!-- Stats bar -->
    <g transform="translate(40,548)">
      <text x="0" y="-12" font-family="'Segoe UI',sans-serif" font-size="13" fill="#c9a9e8" letter-spacing="1">SKILL LEVELS</text>

      <g transform="translate(0,0)">
        <text x="0" y="14" font-family="'Segoe UI',sans-serif" font-size="13" fill="#c9a9e8">Java</text>
        <rect x="90" y="2" width="260" height="14" rx="7" fill="#3a1c5c"/>
        <rect x="90" y="2" width="228.8" height="14" rx="7" fill="url(#barGrad)"/>
        <text x="362" y="14" font-family="'Fira Code',monospace" font-size="12" fill="#f3e9ff">88%</text>
      </g>
      <g transform="translate(0,34)">
        <text x="0" y="14" font-family="'Segoe UI',sans-serif" font-size="13" fill="#c9a9e8">SQL</text>
        <rect x="90" y="2" width="260" height="14" rx="7" fill="#3a1c5c"/>
        <rect x="90" y="2" width="213.2" height="14" rx="7" fill="url(#barGrad)"/>
        <text x="362" y="14" font-family="'Fira Code',monospace" font-size="12" fill="#f3e9ff">82%</text>
      </g>
      <g transform="translate(0,68)">
        <text x="0" y="14" font-family="'Segoe UI',sans-serif" font-size="13" fill="#c9a9e8">Python</text>
        <rect x="90" y="2" width="260" height="14" rx="7" fill="#3a1c5c"/>
        <rect x="90" y="2" width="156.0" height="14" rx="7" fill="url(#barGrad)"/>
        <text x="362" y="14" font-family="'Fira Code',monospace" font-size="12" fill="#f3e9ff">60%</text>
      </g>
      <g transform="translate(0,102)">
        <text x="0" y="14" font-family="'Segoe UI',sans-serif" font-size="13" fill="#c9a9e8">DSA</text>
        <rect x="90" y="2" width="260" height="14" rx="7" fill="#3a1c5c"/>
        <rect x="90" y="2" width="202.8" height="14" rx="7" fill="url(#barGrad)"/>
        <text x="362" y="14" font-family="'Fira Code',monospace" font-size="12" fill="#f3e9ff">78%</text>
      </g>
      <g transform="translate(0,136)">
        <text x="0" y="14" font-family="'Segoe UI',sans-serif" font-size="13" fill="#c9a9e8">Web Dev</text>
        <rect x="90" y="2" width="260" height="14" rx="7" fill="#3a1c5c"/>
        <rect x="90" y="2" width="195.0" height="14" rx="7" fill="url(#barGrad)"/>
        <text x="362" y="14" font-family="'Fira Code',monospace" font-size="12" fill="#f3e9ff">75%</text>
      </g>
    </g>

    <!-- Code editor card -->
    <g transform="translate(700,560)">
      <rect x="0" y="0" width="500" height="150" rx="14" fill="#150822" stroke="#4a2472" stroke-width="1.2"/>
      <circle cx="18" cy="18" r="4" fill="#ff5f56"/>
      <circle cx="32" cy="18" r="4" fill="#ffbd2e"/>
      <circle cx="46" cy="18" r="4" fill="#27c93f"/>
      <text x="250" y="22" text-anchor="middle" font-family="'Segoe UI',sans-serif" font-size="12" fill="#c9a9e8">Dreams.jsx</text>
      <g transform="translate(20,50)">
        <text x="0" y="0" font-family="'Fira Code',monospace" font-size="13" fill="#5ef1ff">function buildDreams() {</text>
        <text x="0" y="24" font-family="'Fira Code',monospace" font-size="13" fill="#5ef1ff">  const skills = ['Java','SQL','Python'];</text>
        <text x="0" y="48" font-family="'Fira Code',monospace" font-size="13" fill="#5ef1ff">  return skills.map(s =&gt; grow(s));</text>
        <text x="0" y="72" font-family="'Fira Code',monospace" font-size="13" fill="#5ef1ff">}</text>
      </g>
    </g>

    <!-- Continuous full-width scanner -->
    <rect x="0" y="0" width="1280" height="14" fill="url(#scanGrad)" opacity="0.7">
      <animate attributeName="y" from="-14" to="740" begin="2.3s" dur="3.5s" repeatCount="indefinite"/>
    </rect>

    <!-- outer border -->
    <rect x="1" y="1" width="1278" height="738" rx="27" fill="none" stroke="#4a2472" stroke-width="1.5"/>
  </g>
</svg>
